# XcodeGen project spec for the Vakter iOS companion + Apple Watch app.
#
# Generate the .xcodeproj with:
#
#     cd iOS && xcodegen generate
#
# XcodeGen install: `brew install xcodegen`. This spec produces an
# Xcode workspace-free project named `VakterCompanion.xcodeproj` with
# two targets:
#
#   - `VakterCompanion`   — iOS app (iPhone + iPad)
#   - `VakterWatch`       — watchOS app, embedded in the iOS bundle
#
# After generating: open `VakterCompanion.xcodeproj`, set the bundle
# identifiers (see SETUP.md), enable iCloud capability, build & run.

name: VakterCompanion
options:
  bundleIdPrefix: app.vakter
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  developmentLanguage: en
  createIntermediateGroups: true

settings:
  base:
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 9TA5GB5UJH    # Jonathan Gebru
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: 5.10
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:

  VakterCompanion:
    type: application
    platform: iOS
    sources:
      - path: VakterCompanion
    info:
      path: VakterCompanion/Info.plist
      properties:
        CFBundleDisplayName: Vakter
        UILaunchScreen:
          UIColorName: ""
        UIRequiredDeviceCapabilities: [armv7]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
    entitlements:
      path: VakterCompanion/VakterCompanion.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers:
          - iCloud.app.vakter.shared
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.developer.ubiquity-kvstore-identifier: "$(TeamIdentifierPrefix)app.vakter.shared"
        aps-environment: development
    dependencies:
      - target: VakterWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.vakter.companion
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Used to show your Mac's location on the map when an alarm fires."
        INFOPLIST_KEY_NSUserNotificationUsageDescription: "Used to alert you when your Mac arms, disarms, or fires an alarm."
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES

  VakterWatch:
    type: application
    platform: watchOS
    sources:
      - path: ../WatchOS/VakterWatch
    info:
      path: ../WatchOS/VakterWatch/Info.plist
      properties:
        CFBundleDisplayName: Vakter
        WKApplication: true
        WKWatchOnly: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.vakter.companion.watchkitapp
        WATCHOS_DEPLOYMENT_TARGET: "10.0"
        INFOPLIST_KEY_CLKComplicationPrincipalClass: ""
