<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 96" role="img" aria-label="Vakter wordmark">
  <title>Vakter</title>

  <!-- Brand colors as named tokens -->
  <defs>
    <linearGradient id="navy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  stop-color="#1c2a4f"/>
      <stop offset="100%" stop-color="#0b1530"/>
    </linearGradient>
    <radialGradient id="lantern" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#fff7d6"/>
      <stop offset="40%" stop-color="#f5b14f"/>
      <stop offset="100%" stop-color="#d99431"/>
    </radialGradient>
  </defs>

  <!-- Icon: square + simplified lighthouse silhouette + lantern dot -->
  <g transform="translate(8, 8)">
    <rect x="0" y="0" width="80" height="80" rx="18" ry="18" fill="url(#navy)"/>
    <!-- Tower: tapered trapezoid + base + galleries -->
    <g fill="#f1ede2" fill-rule="evenodd" transform="translate(40, 16)">
      <!-- Lamp room (the box at top) -->
      <rect x="-9" y="0" width="18" height="9" rx="1"/>
      <!-- Gallery (overhanging deck) -->
      <rect x="-12" y="9" width="24" height="3"/>
      <!-- Tower (tapered from gallery to base) -->
      <path d="M -11 12 L 11 12 L 14 48 L -14 48 Z"/>
      <!-- Base / platform -->
      <rect x="-18" y="48" width="36" height="4"/>
    </g>
    <!-- Lantern light -->
    <circle cx="40" cy="22" r="3.4" fill="url(#lantern)"/>
    <!-- Subtle outer glow on lantern -->
    <circle cx="40" cy="22" r="6.5" fill="#f5b14f" opacity="0.15"/>
  </g>

  <!-- Wordmark -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', Inter, system-ui, sans-serif"
     font-size="42" font-weight="600" letter-spacing="-1.3">
    <text x="108" y="58" fill="#1c2a4f">Vakter</text>
    <text x="108" y="58" fill="#1c2a4f" class="dark-only" style="display: none;"/>
  </g>

  <style>
    @media (prefers-color-scheme: dark) {
      text { fill: #e9ecf3 !important; }
    }
  </style>
</svg>
